<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Virtual University</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-sub">Login to your Virtual University account</p>

      <div class="role-tabs">
        <button id="teacher-tab" class="active">Teacher</button>
        <button id="student-tab">Student</button>
      </div>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="login-btn">Login</button>
      </form>

      <p id="login-msg" class="auth-msg"></p>

      <p class="auth-link">
        Don’t have an account? <a href="./register.html">Register</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
