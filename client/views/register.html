<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Virtual University</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Join Virtual University and start learning</p>

      <div class="role-tabs">
        <button id="teacher-tab" class="active">Teacher</button>
        <button id="student-tab">Student</button>
      </div>

      <form id="register-form">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="register-btn">Register</button>
      </form>

      <p id="register-msg" class="auth-msg"></p>

      <p class="auth-link">
        Already have an account? <a href="./login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
