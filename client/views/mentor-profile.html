<!DOCTYPE html>
<html lang="en" class="h-full bg-gradient-to-br from-[#0B0E1A] via-[#111428] to-[#0B0E1A] text-gray-100">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Profile | Virtual University</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            violetGlow: '#7C3AED',
            neonBlue: '#00D4FF',
            glass: 'rgba(255,255,255,0.05)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="icon" type="image/png" href="../assets/img/icon.png">
</head>

<body class="min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-3xl font-semibold">Teacher Profile</h1>
        <p class="text-gray-400 text-sm">Meet your mentor and explore their courses</p>
      </div>
      <a href="/dashboards/student.html"
        class="px-4 py-2 rounded-lg bg-white/10 border border-white/10 hover:bg-white/20 transition text-sm">← Back to
        Dashboard</a>
    </div>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 bg-glass border border-white/10 p-6 rounded-2xl backdrop-blur-md">
        <div class="flex flex-col items-center text-center">
          <img id="mentorAvatar" src="../assets/img/icon.png" alt="Mentor"
            class="w-28 h-28 rounded-full object-cover border border-white/10">
          <h2 id="mentorName" class="text-xl font-semibold mt-4">Loading...</h2>
          <p id="mentorBio" class="text-sm text-gray-400 mt-2">Fetching teacher bio...</p>
        </div>

        <div class="mt-6 space-y-3 text-sm text-gray-300">
          <div class="flex items-center justify-between">
            <span class="text-gray-400">Email</span>
            <span id="mentorEmail" class="text-white">--</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-400">Joined</span>
            <span id="mentorJoined" class="text-white">--</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-400">Courses</span>
            <span id="mentorCourseCount" class="text-white">0</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-gray-400">Students</span>
            <span id="mentorStudentCount" class="text-white">0</span>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2 space-y-6">
        <div class="bg-glass border border-white/10 p-6 rounded-2xl backdrop-blur-md">
          <h3 class="text-xl font-semibold mb-4">Courses & Enrollments</h3>
          <div id="mentorCourses" class="space-y-4">
            <p class="text-gray-400">Loading courses...</p>
          </div>
        </div>

        <div class="bg-glass border border-white/10 p-6 rounded-2xl backdrop-blur-md">
          <h3 class="text-xl font-semibold mb-4">About this Mentor</h3>
          <p id="mentorAbout" class="text-sm text-gray-300 leading-relaxed">
            Loading details...
          </p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="hidden fixed bottom-5 right-5 bg-violetGlow text-white px-4 py-3 rounded-xl shadow-lg"></div>

  <script type="module" src="../assets/js/mentor-profile.js"></script>
</body>

</html>
